name: Release image

# A release is a change to version.txt on main: the image is tagged with that version.
# The tests run first, and an existing tag is never overwritten.
on:
  push:
    branches:
      - main
    paths:
      - "version.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        run: |
          IMAGE=${REGISTRY}/${{ github.repository_owner }}/sync-tables
          VERSION=$(cat version.txt)
          if docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "${IMAGE}:${VERSION} already exists; bump version.txt to release" >&2
            exit 1
          fi
          docker build -t "${IMAGE}:${VERSION}" .
          docker push "${IMAGE}:${VERSION}"
